# Builds every app flavour on each push to main and publishes them on the GitHub Release
# named after the VERSION file (tag v<VERSION>). Re-pushing with the same VERSION replaces the
# assets of that release.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: Authenticator.xcodeproj
  SCHEME: Authenticator
  APP_NAME: Altosec Authenticator

jobs:
  build:
    name: Build and release
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [ -n "$VERSION" ] || { echo "VERSION file is empty" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build ${{ github.run_number }})"

      - name: Download Rust core
        run: scripts/public/download_rust_package.sh

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation

      # macOS: the project's Release configuration signs macOS builds ad hoc (no developer team
      # needed). Users open the app once with right click > Open because it is not notarized.
      - name: Build macOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData-macOS \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            | grep -E "error:|warning: .*Authenticator/|BUILD " || true
          test -d "build/DerivedData-macOS/Build/Products/Release/Authenticator.app"

      - name: Package macOS app (.zip and .dmg)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/macos
          cp -R "build/DerivedData-macOS/Build/Products/Release/Authenticator.app" "dist/macos/$APP_NAME.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/macos/$APP_NAME.app" "dist/Altosec-Authenticator-$VERSION-macOS.zip"
          ln -s /Applications dist/macos/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dist/macos -ov -format UDZO "dist/Altosec-Authenticator-$VERSION-macOS.dmg"

      # iOS: built without code signing. The .ipa can be installed with a sideloading tool
      # (AltStore, Sideloadly, ...) that signs it with the user's own Apple ID.
      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData-iOS \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            | grep -E "error:|warning: .*Authenticator/|BUILD " || true
          test -d "build/DerivedData-iOS/Build/Products/Release-iphoneos/Authenticator.app"

      - name: Package iOS app (.ipa)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist/ios && mkdir -p dist/ios/Payload
          cp -R "build/DerivedData-iOS/Build/Products/Release-iphoneos/Authenticator.app" dist/ios/Payload/
          (cd dist/ios && zip -qry "../Altosec-Authenticator-$VERSION-iOS-unsigned.ipa" Payload)

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.zip *.dmg *.ipa > "SHA256SUMS-${{ steps.version.outputs.version }}.txt"
          cat "SHA256SUMS-${{ steps.version.outputs.version }}.txt"

      - name: Release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "## Altosec Authenticator $VERSION"
            echo
            echo "Build ${{ steps.version.outputs.build }} from commit ${GITHUB_SHA::7}."
            echo
            echo "| File | Platform | Notes |"
            echo "|---|---|---|"
            echo "| Altosec-Authenticator-$VERSION-macOS.dmg | macOS 14+ (Apple silicon) | Drag to Applications. Not notarized: right click > Open the first time, or run \`xattr -dr com.apple.quarantine \"/Applications/Altosec Authenticator.app\"\`. |"
            echo "| Altosec-Authenticator-$VERSION-macOS.zip | macOS 14+ (Apple silicon) | Same app as the dmg, zipped. |"
            echo "| Altosec-Authenticator-$VERSION-iOS-unsigned.ipa | iOS 17+ | Unsigned. Install with a sideloading tool such as AltStore or Sideloadly, which signs it with your Apple ID. |"
            echo
            echo "SHA-256 checksums are in SHA256SUMS-$VERSION.txt."
          } > dist/RELEASE_NOTES.md

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: altosec-authenticator-${{ steps.version.outputs.version }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.ipa
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Altosec Authenticator ${{ steps.version.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/*.zip
            dist/*.dmg
            dist/*.ipa
            dist/SHA256SUMS-*.txt
          fail_on_unmatched_files: true
